<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<style>

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {

    width: 1080px;

    height: 1920px;

    background: radial-gradient(circle at 50% 30%, #151f38 0%, #070a14 100%);

    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;

    color: #F8FAFC;

    overflow: hidden;

    display: flex;

    flex-direction: column;

    justify-content: space-between;

    padding: 180px 80px 480px 80px; /* Safe Zone: 180px top (handles IG profile/header), 480px bottom (handles audio/caption/navigation overlay) */

    position: relative;

  }



  /* Grid overlay for tech depth */

  .grid-bg {

    position: absolute;

    top: 0; left: 0; width: 100%; height: 100%;

    background-size: 60px 60px;

    background-image: 

      linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),

      linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);

    pointer-events: none;

  }



  /* Header (Safe zone top) */

  .header {

    z-index: 10;

    display: flex;

    justify-content: space-between;

    align-items: center;

  }

  .series-tag {

    background: rgba(34, 211, 238, 0.15);

    border: 1px solid #22D3EE;

    color: #22D3EE;

    padding: 12px 24px;

    border-radius: 999px;

    font-size: 26px;

    font-weight: 700;

    letter-spacing: 1px;

    text-transform: uppercase;

  }

  .brand {

    font-size: 30px;

    font-weight: 800;

    color: #94A3B8;

    letter-spacing: 2px;

  }

  .brand span { color: #38BDF8; }



  /* Title block */

  .hero-title {

    z-index: 10;

    margin-top: 20px;

    margin-bottom: 20px;

  }

  .hero-day {

    font-size: 30px;

    font-weight: 800;

    color: #38BDF8;

    margin-bottom: 10px;

    letter-spacing: 2px;

    text-transform: uppercase;

  }

  .hero-concept {

    font-size: 62px;

    font-weight: 900;

    line-height: 1.15;

    background: linear-gradient(135deg, #FFFFFF 30%, #94A3B8 100%);

    -webkit-background-clip: text;

    -webkit-text-fill-color: transparent;

  }



  /* Stage Content Container - Centered Vertically in Screen */

  .stage {

    z-index: 10;

    flex: 1;

    display: flex;

    flex-direction: column;

    justify-content: center; /* PERFECT VERTICAL CENTERING */

    margin: 20px 0;

  }



  /* Cards */

  .card {

    background: rgba(15, 23, 42, 0.85);

    border: 1px solid rgba(255, 255, 255, 0.12);

    border-radius: 32px;

    padding: 44px;

    backdrop-filter: blur(20px);

    box-shadow: 0 30px 70px rgba(0, 0, 0, 0.6);

  }



  .card-header {

    display: flex;

    align-items: center;

    gap: 16px;

    margin-bottom: 26px;

  }

  .pill {

    padding: 10px 20px;

    border-radius: 10px;

    font-size: 24px;

    font-weight: 800;

    text-transform: uppercase;

  }

  .pill-red { background: rgba(239, 68, 68, 0.2); color: #EF4444; border: 1px solid #EF4444; }

  .pill-green { background: rgba(16, 185, 129, 0.2); color: #10B981; border: 1px solid #10B981; }



  .card-title {

    font-size: 38px;

    font-weight: 800;

  }



  /* Code block */

  .code-container {

    background: #050811;

    border: 1px solid #1E293B;

    border-radius: 20px;

    padding: 30px;

    font-family: 'Consolas', 'Courier New', monospace;

    font-size: 28px;

    line-height: 1.5;

    color: #E2E8F0;

  }

  .kw { color: #F43F5E; font-weight: bold; }

  .fn { color: #38BDF8; }

  .str { color: #34D399; }

  .com { color: #64748B; font-style: italic; }

  .val { color: #F59E0B; }



  /* Flow Diagram */

  .flow-box {

    display: flex;

    align-items: center;

    justify-content: space-between;

    background: #050811;

    border: 1px solid #1E293B;

    border-radius: 20px;

    padding: 26px 32px;

    margin: 20px 0;

  }

  .node {

    background: rgba(30, 41, 59, 0.8);

    border: 1px solid rgba(255, 255, 255, 0.15);

    padding: 18px 28px;

    border-radius: 14px;

    font-size: 26px;

    font-weight: 700;

    text-align: center;

  }

  .node.accent {

    border-color: #22D3EE;

    color: #22D3EE;

    background: rgba(34, 211, 238, 0.1);

  }

  .arrow {

    font-size: 32px;

    color: #64748B;

    font-weight: bold;

  }



  /* Bottom Takeaway */

  .takeaway {

    background: linear-gradient(90deg, rgba(34, 211, 238, 0.15), rgba(99, 102, 241, 0.15));

    border-left: 8px solid #22D3EE;

    border-radius: 0 18px 18px 0;

    padding: 30px 40px;

    font-size: 30px;

    line-height: 1.45;

    color: #E2E8F0;

  }

  .takeaway b { color: #22D3EE; }



  /* Subtitles Bar - Lifted safely into social/shorts universal safe zone */

  .caption-bar {

    z-index: 20;

    background: rgba(7, 10, 20, 0.95);

    border: 2px solid #38BDF8;

    border-radius: 22px;

    padding: 20px 36px;

    text-align: center;

    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(56, 189, 248, 0.25);

    margin-top: 15px;

  }

  .caption-text {

    font-size: 30px;

    font-weight: 800;

    color: #FFFFFF;

    line-height: 1.35;

  }

  .highlight-word {

    color: #FDE047;

    text-shadow: 0 0 18px rgba(253, 224, 71, 0.5);

  }

</style>

</head>

<body>

  <div class="grid-bg"></div>



  <!-- Header -->

  <div class="header">

    <div class="series-tag">AI Explained • Day 01</div>

    <div class="brand">NEU<span>BENCH</span></div>

  </div>



  <!-- Hero Concept -->

  <div class="hero-title">

    <div class="hero-day">Fundamental Mental Model</div>

    <div class="hero-concept" id="scene-title">Rules-Based Code vs. Learned Behavior</div>

  </div>



  <!-- Stage Content (True Vertical Center) -->

  <div class="stage" id="stage-content">

    <!-- Populated per scene -->

  </div>



  <!-- Subtitle Bar (Sitting naturally below content with generous padding) -->

  <div class="caption-bar">

    <div class="caption-text" id="caption-box">

      <!-- Dynamic caption text -->

    </div>

  </div>

</body>

</html>
