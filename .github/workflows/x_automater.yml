name: X-Post-Automater 24/7 Engine

on:
  schedule:
    # Runs automatically roughly every 45 minutes
    - cron: '*/45 * * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab

jobs:
  run-automater:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Restore X Session
        env:
          X_COOKIES_BASE64: ${{ secrets.X_COOKIES_BASE64 }}
        run: |
          mkdir -p browser_session
          echo "$X_COOKIES_BASE64" | base64 --decode > browser_session/cookies.json

      - name: Run Automated Post or Sniper Reply
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          PYTHONIOENCODING: utf-8
        run: |
          python main.py run-once
