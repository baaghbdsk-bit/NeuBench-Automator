name: NeuBench-Automator 24/7 Cloud Autopilot (𝕏, LinkedIn, Bluesky)

on:
  schedule:
    # Runs every 2 hours (12 times per day) across 𝕏, LinkedIn, and Bluesky
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (simulate without publishing)'
        required: false
        default: 'false'
        type: string
      action:
        description: 'Action to execute'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - post-all
          - post
          - reply
          - repost
          - linkedin
          - bluesky

concurrency:
  group: 'neubench-automator-cloud-engine'
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-automater:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (ffmpeg, fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      - name: Restore Browser Sessions
        env:
          X_COOKIES_BASE64: ${{ secrets.X_COOKIES_BASE64 }}
          LINKEDIN_COOKIES_BASE64: ${{ secrets.LINKEDIN_COOKIES_BASE64 }}
        run: |
          mkdir -p browser_session linkedin_session
          if [ -n "$X_COOKIES_BASE64" ]; then
            echo "$X_COOKIES_BASE64" | base64 --decode > browser_session/cookies.json
          fi
          if [ -n "$LINKEDIN_COOKIES_BASE64" ]; then
            echo "$LINKEDIN_COOKIES_BASE64" | base64 --decode > linkedin_session/cookies.json
          fi

      - name: Execute Autonomous Broadcast Cycle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_API_VERSION: '202610'
          PYTHONIOENCODING: utf-8
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          TRIAL_ENABLED: 'true'
          MAX_DAILY_X_ORIGINALS: '12'
          MAX_DAILY_X_REPLIES: '12'
          MAX_DAILY_X_REPOSTS: '6'
          MAX_DAILY_LINKEDIN: '999'
          MAX_DAILY_BLUESKY: '12'
          MAX_DAILY_TOTAL: '40'
        run: |
          ACTION="${{ inputs.action || 'auto' }}"
          if [ "$DRY_RUN" = "true" ]; then
            if [ -n "$ACTION" ] && [ "$ACTION" != "auto" ]; then
              python main.py "$ACTION" --dry-run
            else
              python main.py post-all --dry-run
            fi
          else
            if [ -n "$ACTION" ] && [ "$ACTION" != "auto" ]; then
              python main.py "$ACTION"
            else
              python main.py post-all
            fi
          fi

      - name: 𝕏 Viral Sniper Reply / Quote-Tweet Engagement
        if: ${{ (inputs.action == 'auto' || inputs.action == '' || inputs.action == 'reply' || inputs.action == 'repost') && always() }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          PYTHONIOENCODING: utf-8
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          TRIAL_ENABLED: 'true'
          MAX_DAILY_X_REPLIES: '12'
          MAX_DAILY_X_REPOSTS: '6'
        run: |
          ACTION="${{ inputs.action || 'auto' }}"
          # Alternate between Sniper Reply and Quote-Tweet based on current hour
          HOUR=$(date -u +%H)
          if [ "$ACTION" = "repost" ] || { [ "$ACTION" = "auto" ] && [ $((10#$HOUR % 4)) -eq 0 ]; }; then
            echo "🎯 Executing 𝕏 Quote-Tweet with commentary..."
            if [ "$DRY_RUN" = "true" ]; then
              python main.py repost --dry-run || echo "Quote-tweet skipped or completed."
            else
              python main.py repost || echo "Quote-tweet skipped or completed."
            fi
          else
            echo "🎯 Executing 𝕏 Viral Sniper Reply..."
            if [ "$DRY_RUN" = "true" ]; then
              python main.py reply --dry-run || echo "Sniper reply skipped or completed."
            else
              python main.py reply || echo "Sniper reply skipped or completed."
            fi
          fi

      - name: Persist Metrics and Post History
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          for file in post_history.json trial_metrics.json linkedin_network.json linkedin_post_history.json linkedin_engagement_history.json; do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done
          git commit -m "chore(cloud): autonomous update post metrics [skip ci]" || echo "No changes to commit"
          git pull --rebase --autostash origin main || true
          git push origin main || echo "Push skipped or non-fast-forward"

      - name: Generate Run Summary
        if: always()
        run: |
          echo "## 📊 NeuBench-Automator Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Execution Mode:** Cloud Autopilot (Ubuntu 24.04)" >> $GITHUB_STEP_SUMMARY
          echo "- **Platforms:** 𝕏 (Twitter), Bluesky, LinkedIn" >> $GITHUB_STEP_SUMMARY
          echo "- **Cadence:** Every 2 Hours (12 runs/day)" >> $GITHUB_STEP_SUMMARY
          echo "- **Execution Time (UTC):** $(date -u)" >> $GITHUB_STEP_SUMMARY
          if [ -f "post_history.json" ]; then
            TOTAL_POSTS=$(python -c "import json; data=json.load(open('post_history.json')); print(len(data.get('posted_tweets', [])))" 2>/dev/null || echo "N/A")
            echo "- **Total Tracked Posts:** $TOTAL_POSTS" >> $GITHUB_STEP_SUMMARY
          fi
