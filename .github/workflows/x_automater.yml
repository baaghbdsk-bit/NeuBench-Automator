name: NeuBench-Automator 24/7 Cloud Autopilot

on:
  schedule:
    # Continuous omnichannel rotation & viral engagement heartbeat (every 45 minutes).
    # LinkedIn now runs in its own dedicated workflow every 3 hours.
    - cron: '*/45 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (simulate without publishing)'
        required: false
        default: 'false'
        type: string
      action:
        description: 'Force specific action (leave auto for intelligent rotation)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - post
          - reply
          - repost
          - omnichannel
          - bluesky
          - bluesky-replies
          - linkedin
          - linkedin-replies
          - linkedin-peers
          - threads
          - threads-replies
          - instagram
          - devto
          - pinterest
          - youtube
          - render-video

concurrency:
  group: >-
    ${{ (inputs.action == 'linkedin' || inputs.action == 'linkedin-replies' || inputs.action == 'linkedin-peers') && 'neubench-linkedin-state' || 'neubench-automator-cloud-engine' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-automater:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      - name: Restore Multi-Platform Browser Sessions
        env:
          X_COOKIES_BASE64: ${{ secrets.X_COOKIES_BASE64 }}
          LINKEDIN_COOKIES_BASE64: ${{ secrets.LINKEDIN_COOKIES_BASE64 }}
          THREADS_COOKIES_BASE64: ${{ secrets.THREADS_COOKIES_BASE64 }}
          INSTAGRAM_COOKIES_BASE64: ${{ secrets.INSTAGRAM_COOKIES_BASE64 }}
          PINTEREST_COOKIES_BASE64: ${{ secrets.PINTEREST_COOKIES_BASE64 }}
        run: |
          mkdir -p browser_session linkedin_session threads_session instagram_session pinterest_session
          if [ -n "$X_COOKIES_BASE64" ]; then
            echo "$X_COOKIES_BASE64" | base64 --decode > browser_session/cookies.json
          fi
          if [ -n "$LINKEDIN_COOKIES_BASE64" ]; then
            echo "$LINKEDIN_COOKIES_BASE64" | base64 --decode > linkedin_session/cookies.json
          fi
          if [ -n "$THREADS_COOKIES_BASE64" ]; then
            echo "$THREADS_COOKIES_BASE64" | base64 --decode > threads_session/cookies.json
          fi
          if [ -n "$INSTAGRAM_COOKIES_BASE64" ]; then
            echo "$INSTAGRAM_COOKIES_BASE64" | base64 --decode > instagram_session/cookies.json
          fi
          if [ -n "$PINTEREST_COOKIES_BASE64" ]; then
            echo "$PINTEREST_COOKIES_BASE64" | base64 --decode > pinterest_session/cookies.json
          fi

      - name: Execute Automated Cycle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_API_VERSION: '202610'
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          YOUTUBE_TOKEN_BASE64: ${{ secrets.YOUTUBE_TOKEN_BASE64 }}
          PYTHONIOENCODING: utf-8
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          TRIAL_ENABLED: 'true'
          MAX_DAILY_ORIGINAL_POSTS: '0'
          MAX_DAILY_REPLIES: '0'
          MAX_DAILY_REPOSTS: '0'
          MAX_DAILY_TOTAL: '0'
        run: |
          ACTION="${{ inputs.action || 'auto' }}"
          if [ "$DRY_RUN" = "true" ]; then
            if [ -n "$ACTION" ] && [ "$ACTION" != "auto" ]; then
              python main.py "$ACTION" --dry-run
            else
              python main.py run-once --dry-run
            fi
          else
            if [ -n "$ACTION" ] && [ "$ACTION" != "auto" ]; then
              python main.py "$ACTION"
            else
              python main.py run-once
            fi
          fi

      - name: Automated LinkedIn Post (every 3 hours)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_API_VERSION: '202610'
          PYTHONIOENCODING: utf-8
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          LINKEDIN_ENABLED: 'true'
          MAX_DAILY_LINKEDIN: '8'
          LINKEDIN_MIN_INTERVAL_MINUTES: '180'
          LINKEDIN_SCHEDULE_GRACE_MINUTES: '60'
          MAX_DAILY_ORIGINAL_POSTS: '0'
          MAX_DAILY_REPLIES: '0'
          MAX_DAILY_REPOSTS: '0'
          MAX_DAILY_TOTAL: '0'
        run: |
          ACTION="${{ inputs.action || 'auto' }}"
          if [ "$ACTION" != "auto" ]; then
            echo "Skipping automatic LinkedIn post (requested action: $ACTION)."
            exit 0
          fi
          HOUR=$(date -u +%H)
          if [ $((10#$HOUR % 3)) -ne 0 ]; then
            echo "LinkedIn post runs every 3 hours; hour $HOUR UTC is not a slot."
            exit 0
          fi
          if [ "$DRY_RUN" = "true" ]; then
            python main.py linkedin --dry-run || echo "LinkedIn post skipped/failed; state preserved."
          else
            python main.py linkedin || echo "LinkedIn post skipped/failed; state preserved."
          fi

      - name: Automated LinkedIn Engagement (every 2 hours)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_API_VERSION: '202610'
          PYTHONIOENCODING: utf-8
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          LINKEDIN_ENABLED: 'true'
          MAX_DAILY_LINKEDIN: '0'
          MAX_DAILY_LINKEDIN_PEER_COMMENTS: '10'
          MAX_DAILY_ORIGINAL_POSTS: '0'
          MAX_DAILY_REPLIES: '0'
          MAX_DAILY_REPOSTS: '0'
          MAX_DAILY_TOTAL: '0'
        run: |
          ACTION="${{ inputs.action || 'auto' }}"
          if [ "$ACTION" != "auto" ]; then
            echo "Skipping automatic LinkedIn engagement (requested action: $ACTION)."
            exit 0
          fi
          HOUR=$(date -u +%H)
          if [ $((10#$HOUR % 2)) -ne 0 ]; then
            echo "LinkedIn engagement runs every 2 hours; hour $HOUR UTC is not a slot."
            exit 0
          fi
          if [ "$DRY_RUN" = "true" ]; then
            python main.py linkedin-peers --dry-run || echo "LinkedIn engagement skipped/failed; state preserved."
          else
            python main.py linkedin-peers || echo "LinkedIn engagement skipped/failed; state preserved."
          fi

      - name: Persist Trial Metrics and Post History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add post_history.json trial_metrics.json linkedin_network.json linkedin_post_history.json linkedin_engagement_history.json || true
          git commit -m "chore(cloud): autonomous update post metrics [skip ci]" || echo "No changes to commit"
          git pull --rebase --autostash origin main || true
          git push origin main || echo "Push skipped or non-fast-forward"

      - name: Generate Run Summary
        if: always()
        run: |
          echo "## 📊 NeuBench-Automator Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Execution Mode:** Cloud Autopilot (Ubuntu 24.04)" >> $GITHUB_STEP_SUMMARY
          echo "- **Platforms:** 𝕏 (Twitter), Bluesky, LinkedIn, Threads, Instagram" >> $GITHUB_STEP_SUMMARY
          echo "- **Execution Time (UTC):** $(date -u)" >> $GITHUB_STEP_SUMMARY
          if [ -f "post_history.json" ]; then
            TOTAL_POSTS=$(python -c "import json; data=json.load(open('post_history.json')); print(len(data.get('posted_tweets', [])))" 2>/dev/null || echo "N/A")
            echo "- **Total Tracked Posts:** $TOTAL_POSTS" >> $GITHUB_STEP_SUMMARY
          fi
