name: Instagram Session Diagnostics (MANUAL ONLY)

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Optional note for this diagnostic run"
        required: false
        default: ""

permissions:
  contents: read
  actions: write

concurrency:
  group: ig-diagnose
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Restore Instagram session (secret never printed)
        env:
          INSTAGRAM_COOKIES_BASE64: ${{ secrets.INSTAGRAM_COOKIES_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p instagram_session
          if [ -z "${INSTAGRAM_COOKIES_BASE64:-}" ]; then
            echo "SECRET_EMPTY=true" >> "$GITHUB_ENV"
            echo "Instagram secret is empty"
            exit 0
          fi
          echo "$INSTAGRAM_COOKIES_BASE64" | base64 --decode > instagram_session/cookies.json
          python - <<'PY'
          import json
          p = "instagram_session/cookies.json"
          try:
              d = json.load(open(p, encoding="utf-8"))
              c = d.get("cookies", d) if isinstance(d, dict) else d
              print(f"restored_cookies={len(c) if isinstance(c, list) else 0}")
          except Exception as e:
              print(f"restore_parse_error={type(e).__name__}")
          PY

      - name: Run read-only Instagram diagnostic
        id: diag
        env:
          IG_DIAGNOSE: "1"
        run: |
          set +e
          python scripts/ig_diagnose.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Upload diagnostic artifact (on non-clean result)
        if: steps.diag.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: ig-diag-${{ github.run_id }}
          path: |
            generated_visuals/ig_diag_report.json
            generated_visuals/ig_diag.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Run summary
        if: always()
        run: |
          echo "## Instagram Session Diagnostic" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f generated_visuals/ig_diag_report.json ]; then
            python - <<'PY'
            import json
            r = json.load(open("generated_visuals/ig_diag_report.json", encoding="utf-8"))
            print(f"- Classification: **{r.get('classification')}**")
            print(f"- Exit code: {r.get('exit_code')}")
            print(f"- Cookies restored: {r.get('cookie_count')}")
            print(f"- Create available: {r.get('create_available')}")
            print(f"- Create count: {r.get('create_count')}")
            print(f"- Home count: {r.get('home_count')}")
            ev = r.get("evidence") or {}
            print(f"- Auth signals: {ev.get('auth_signals')}")
            print(f"- Login signals: {ev.get('login_signals')}")
            print(f"- Checkpoint signals: {ev.get('checkpoint_signals')}")
            print(f"- 2FA signals: {ev.get('two_factor_signals')}")
            print(f"- Consent signals: {ev.get('consent_signals')}")
            PY >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- No report produced (script failed before writing)." >> "$GITHUB_STEP_SUMMARY"
          fi
