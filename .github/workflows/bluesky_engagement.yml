name: Bluesky Engagement (Every 3 Hours)

on:
  schedule:
    # Replies are the highest-ROI Bluesky lever. Own lane: the posting job's
    # global cap previously killed the only reply attempt (25/20).
    - cron: '15 */3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode'
        required: false
        default: 'false'
        type: string

concurrency:
  group: bluesky-engagement
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bluesky-engage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bluesky Replies
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          PYTHONIOENCODING: utf-8
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          TRIAL_ENABLED: 'true'
          # Engagement only: zero broadcasting caps so the shared global total
          # cannot starve this job like it starved LinkedIn engagement.
          MAX_DAILY_TOTAL: '0'
          MAX_DAILY_X_ORIGINALS: '0'
          MAX_DAILY_X_REPLIES: '0'
          MAX_DAILY_X_REPOSTS: '0'
          MAX_DAILY_BLUESKY: '0'
          MAX_DAILY_LINKEDIN: '0'
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python main.py bluesky-replies --dry-run
          else
            python main.py bluesky-replies
          fi

      - name: Persist Reply State
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          for state_file in post_history.json trial_metrics.json; do
            if [ -f "$state_file" ]; then
              git add "$state_file"
            fi
          done
          if git diff --cached --quiet; then
            echo "No Bluesky reply state changes to commit"
          else
            git commit -m "chore(cloud): bluesky reply state [skip ci]" || true
          fi
          pushed=false
          for i in 1 2 3; do
            if git pull --rebase --autostash -X theirs origin main; then
              if git push origin main; then
                pushed=true
                break
              fi
            else
              git rebase --abort || true
            fi
          done
          if [ "$pushed" = false ]; then
            echo "::warning::Could not push Bluesky reply state after 3 attempts"
          fi
