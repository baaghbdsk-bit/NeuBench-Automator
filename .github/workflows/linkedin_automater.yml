name: NeuBench LinkedIn Autopilot (Every 3 Hours)

on:
  schedule:
    # One detailed LinkedIn post every 3 hours (staggered to avoid clashing with the omnichannel heartbeat).
    - cron: '15 */3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode (simulate without publishing)'
        required: false
        default: 'false'
        type: string

concurrency:
  group: neubench-linkedin-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-linkedin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (ffmpeg, fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      - name: Restore LinkedIn Browser Session
        env:
          LINKEDIN_COOKIES_BASE64: ${{ secrets.LINKEDIN_COOKIES_BASE64 }}
        run: |
          mkdir -p linkedin_session
          if [ -n "$LINKEDIN_COOKIES_BASE64" ]; then
            echo "$LINKEDIN_COOKIES_BASE64" | base64 --decode > linkedin_session/cookies.json
          fi

      - name: Publish LinkedIn Post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_API_VERSION: '202610'
          PYTHONIOENCODING: utf-8
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          TRIAL_ENABLED: 'true'
          MAX_DAILY_ORIGINAL_POSTS: '0'
          MAX_DAILY_REPLIES: '0'
          MAX_DAILY_REPOSTS: '0'
          MAX_DAILY_TOTAL: '0'
          MAX_DAILY_LINKEDIN: '4'
          LINKEDIN_MIN_INTERVAL_MINUTES: '180'
          LINKEDIN_SCHEDULE_GRACE_MINUTES: '60'
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python main.py linkedin --dry-run
          else
            python main.py linkedin
          fi

      - name: Persist LinkedIn State
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          for state_file in linkedin_post_history.json trial_metrics.json linkedin_engagement_history.json; do
            if [ -f "$state_file" ]; then
              git add "$state_file"
            fi
          done
          if git diff --cached --quiet; then
            echo "No LinkedIn state changes to commit"
          else
            git commit -m "chore(cloud): linkedin autopilot state [skip ci]"
          fi
          pushed=false
          for i in 1 2 3; do
            if git pull --rebase --autostash -X theirs origin main; then
              if git push origin main; then
                pushed=true
                break
              fi
            else
              git rebase --abort || true
            fi
            sleep 5
          done
          if [ "$pushed" != "true" ]; then
            echo "LinkedIn state could not be synchronized with origin/main"
            exit 1
          fi

      - name: Generate Run Summary
        if: always()
        run: |
          echo "## 💼 NeuBench LinkedIn Autopilot" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Cadence:** Every 3 hours" >> $GITHUB_STEP_SUMMARY
          echo "- **One detailed post with hashtags and an auto-selected visual**" >> $GITHUB_STEP_SUMMARY
          echo "- **Execution Time (UTC):** $(date -u)" >> $GITHUB_STEP_SUMMARY
          if [ -f "linkedin_post_history.json" ]; then
            TOTAL=$(python -c "import json; data=json.load(open('linkedin_post_history.json')); print(len(data.get('posted_titles', [])))" 2>/dev/null || echo "N/A")
            echo "- **Tracked LinkedIn Topics:** $TOTAL" >> $GITHUB_STEP_SUMMARY
          fi
